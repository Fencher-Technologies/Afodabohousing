name: Expo Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Who am I
        working-directory: MobileAppAfodabo_v2
        env:
          EXPO_TOKEN: _VpSvXcqcV1UA8csXv4f5EBZw4GlW2GGVOGPGac4
        run: npx eas-cli@latest whoami

      - name: Project info
        working-directory: MobileAppAfodabo_v2
        env:
          EXPO_TOKEN: _VpSvXcqcV1UA8csXv4f5EBZw4GlW2GGVOGPGac4
        run: npx eas-cli@latest project:info

      - name: What projectId is checked out
        run: grep -A3 '"eas"' MobileAppAfodabo_v2/app.json
