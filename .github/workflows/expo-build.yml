name: Expo Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cd MobileAppAfodabo_v2
          echo "EXPO_PUBLIC_API_URL=https://afodabohousing.onrender.com" > .env

      - name: Patch eas.json with API URL
        run: |
          cd MobileAppAfodabo_v2
          jq '.build.preview.env.EXPO_PUBLIC_API_URL = "https://afodabohousing.onrender.com" | .build.production.env.EXPO_PUBLIC_API_URL = "https://afodabohousing.onrender.com/"' eas.json > eas.json.tmp
          mv eas.json.tmp eas.json

      - name: Install expo-build-properties plugin
        run: |
          cd MobileAppAfodabo_v2
          npm install --save expo-build-properties

      - name: Patch app.json for minSdkVersion (recent phones only)
        run: |
          cd MobileAppAfodabo_v2
          # Add expo-build-properties to .expo.plugins (NOT root .plugins)
          jq '.expo.plugins += [["expo-build-properties", {"android": {"minSdkVersion": 28}}]]' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "=== Patched app.json ==="
          cat app.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          cd MobileAppAfodabo_v2
          npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GitHub's Ubuntu runners already include the Android SDK, so there is
      # nothing to install. The android-actions/setup-android action started
      # failing after the runner image was updated; pointing at the SDK that
      # is already there avoids depending on it at all.
      - name: Point at the runner's Android SDK
        run: |
          SDK="$ANDROID_SDK_ROOT"
          [ -d "$SDK" ] || SDK="$ANDROID_HOME"
          [ -d "$SDK" ] || SDK="/usr/local/lib/android/sdk"
          if [ ! -d "$SDK" ]; then
            echo "No Android SDK found on this runner"; exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          echo "Using Android SDK at $SDK"
          ls "$SDK"
          yes | "$SDK"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Recreate Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/MobileAppAfodabo_v2/my-release-key.keystore"

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android App (Local Mode on Runner)
        working-directory: MobileAppAfodabo_v2
        env:
          EXPO_TOKEN: _VpSvXcqcV1UA8csXv4f5EBZw4GlW2GGVOGPGac4
          NODE_ENV: production
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/MobileAppAfodabo_v2/my-release-key.keystore
          ANDROID_KEYSTORE_PASSWORD: changeit123
          ANDROID_KEY_ALIAS: my-key-alias
          ANDROID_KEY_PASSWORD: changeit123
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          eas build --local --platform android --profile preview --non-interactive

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-build
          path: MobileAppAfodabo_v2/*.apk
          if-no-files-found: error
