services:
  - type: web
    name: axis-api
    runtime: docker
    repo: https://github.com/Fencher-Technologies/Afodabohousing
    branch: main
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://axishousings.com","https://www.axishousings.com","https://afodabohousing.vercel.app"]'
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Reverse proxies in front of the API that append to X-Forwarded-For. The
      # client address is read this many entries from the right; the left side
      # is caller-controlled. Verify against a live request before changing.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: PESAPAL_ENVIRONMENT
        value: live
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_IPN_URL
        sync: false
